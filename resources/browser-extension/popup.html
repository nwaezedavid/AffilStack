<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AffilStack Capture</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a2233;
      background: #ffffff;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h1 .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #0f1f3d;
      color: #e8b64c;
      font-size: 10px;
    }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #667085; margin-bottom: 3px; }
    input[type="text"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #d7dce3;
      border-radius: 6px;
      font-size: 13px;
    }
    .page-title { font-size: 12px; color: #667085; word-break: break-word; margin-bottom: 10px; }
    .selection-note { font-size: 11px; color: #667085; margin-bottom: 10px; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #0f1f3d;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; }
    #status.error { color: #b42318; }
    #status.success { color: #027a48; }
    .setup {
      font-size: 12px;
      color: #667085;
    }
    .setup a { color: #0f1f3d; }
  </style>
</head>
<body>
  <h1><span class="badge">AS</span> Capture this page</h1>

  <div id="setup" class="setup" hidden>
    Not connected yet — <a href="#" id="openOptions">add your API token</a> first.
  </div>

  <div id="form">
    <div class="page-title" id="pageTitle"></div>
    <div class="selection-note" id="selectionNote"></div>

    <div class="field">
      <label for="pageType">Page type</label>
      <select id="pageType">
        <option value="product_page">Product page</option>
        <option value="competitor_ad">Competitor ad</option>
        <option value="linkedin_post">LinkedIn post</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label for="offer">Attach to (optional)</label>
      <select id="offer">
        <option value="">Not attached</option>
      </select>
    </div>

    <button id="save">Save to AffilStack</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
