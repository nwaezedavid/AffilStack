; PHP2Shell hardening (CVE-2026-109618 / CVE-2026-109619), read by PHP-FPM,
; CGI and LiteSpeed for this website. Only settings PHP accepts here, so it
; never produces the start-up warnings PHP2Shell abuses. Updating PHP to
; 8.4.27 / 8.5.12 or newer is the real fix — these narrow the attack paths
; for any future bug of the same kind.

; AffilStack doesn't use upload progress; PHP2Shell is reached through it.
session.upload_progress.enabled = 0

; Deeply nested form fields only exist to exhaust memory.
max_input_nesting_level = 16

; Request size: the largest upload AffilStack accepts is 12 MB (one file) and
; about 25 MB in one form, so anything bigger is refused before PHP parses it
; (PHP2Shell's memory-exhaustion path needs large multipart requests).
upload_max_filesize = 16M
post_max_size = 40M
