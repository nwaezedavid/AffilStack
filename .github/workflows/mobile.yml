name: Mobile app

# The Expo app in mobile/. Runs only when the app (or this file) changes,
# so it never slows down or affects the PHP 8.4/8.5 test workflow.
on:
  push:
    branches:
      - affilstack-app
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    name: Typecheck, tests and web bundle

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Bundle check (web export with demo data)
        run: EXPO_PUBLIC_DEMO_MODE=1 npx expo export --platform web --output-dir dist
